name: 데이터 작업
description: 재료·상품 사전, 시드 레시피, 추천용 속성 데이터를 추가하거나 수정합니다.
title: "[DATA] "
labels: ["data"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 데이터 종류
      options:
        - 재료·상품 사전 (이름, 분류, 별칭)
        - 시드 레시피 (초기 랭킹·추천용)
        - 맛·식감 태그 (추천 분석용 속성)
        - 기타
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 무엇을 추가·수정하나요
      placeholder: 편의점 라면류 상품 20건을 재료 사전에 추가하고 매운맛·국물 태그를 붙입니다.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 출처
      description: 상품 정보나 레시피를 참고한 곳. 팀이 직접 만든 데이터면 "자체 작성"
  - type: checkboxes
    id: check
    attributes:
      label: 확인 항목
      options:
        - label: 이름·분류 표기가 기존 사전과 같은 규칙입니다
        - label: 중복 항목이 없습니다
        - label: 시드 레시피는 "AI 생성" / "팀 작성" 출처가 표시되어 있습니다
        - label: 실제 사용자 리뷰처럼 보이는 가짜 리뷰·평점을 넣지 않았습니다
  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
