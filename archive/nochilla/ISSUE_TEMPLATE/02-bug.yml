name: 버그 신고
description: 동작하지 않거나 잘못된 결과가 나옵니다.
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 어떤 문제가 있나요
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - 치명 - 잘못된 자격 판정 결과가 사용자에게 표시됨
        - 높음 - 핵심 기능이 동작하지 않음
        - 보통 - 불편하지만 우회할 수 있음
        - 낮음 - 표시 오류, 오타
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: 로컬 / AWS 배포, Chrome 모바일
